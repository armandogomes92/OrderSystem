name: CD

on:
  push:
    branches: [develop, main]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/order-generator-web/package-lock.json

      - name: Testes do backend
        working-directory: backend
        run: dotnet test -c Release

      - name: Publicação do backend
        working-directory: backend
        run: |
          dotnet publish OrderAccumulator/src/OrderAccumulator.Worker -c Release -o ../publish/order-accumulator
          dotnet publish OrderGenerator/src/OrderGenerator.Api -c Release -o ../publish/order-generator-api

      - name: Build do frontend
        working-directory: frontend/order-generator-web
        env:
          VITE_API_URL: ${{ vars.API_URL || 'http://localhost:5298' }}
        run: |
          npm ci
          npm run lint
          npm run build
          cp -r dist ../../publish/order-generator-web

      - uses: actions/upload-artifact@v4
        with:
          name: order-system-${{ github.ref_name }}-${{ github.sha }}
          path: publish/
