name: CD

on:
  push:
    branches: [develop, main]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test -c Release
      - run: dotnet publish OrderAccumulator/src/OrderAccumulator.Worker -c Release -o publish/order-accumulator
      - run: dotnet publish OrderGenerator/src/OrderGenerator.Api -c Release -o publish/order-generator-api
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.ref_name }}-${{ github.sha }}
          path: backend/publish/